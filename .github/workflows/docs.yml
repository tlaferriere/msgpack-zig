name: Documentation
on:
  push:
    branches:
      - '**'

# Serialize gh-pages publishes so concurrent branch pushes don't race the
# force-push to the gh-pages branch.
concurrency:
  group: gh-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    name: Build and publish documentation
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
      - run: zig build docs

      # Default branch: publish to the site root. keep_files preserves the
      # per-branch preview subdirectories.
      - name: Publish default-branch docs
        if: github.ref_name == github.event.repository.default_branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./zig-out/docs
          keep_files: true

      # Non-default branches: publish to branch/<branch-name>/ so each branch
      # gets its own selectable sub-page instead of colliding with the root
      # deployment (which previously failed the github-pages environment
      # protection rule).
      - name: Publish branch-preview docs
        if: github.ref_name != github.event.repository.default_branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./zig-out/docs
          destination_dir: branch/${{ github.ref_name }}
          keep_files: true
